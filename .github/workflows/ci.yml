name: CI Build Test Image
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  packages: write
jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}/catdog-mlops:${{ github.sha }} -t ghcr.io/${{ github.repository }}/catdog-mlops:latest .
      - name: Publish Docker image
        run: docker push ghcr.io/${{ github.repository }}/catdog-mlops:latest
