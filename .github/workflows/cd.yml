name: CD Deploy Compose
on:
  workflow_run:
    workflows: ["CI Build Test Image"]
    types: [completed]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest image
        run: docker pull ghcr.io/${{ github.repository }}/catdog-mlops:latest
      - name: Deploy Docker Compose
        run: |
          docker tag ghcr.io/${{ github.repository }}/catdog-mlops:latest catdog-mlops:local
          docker compose -f deployment/docker-compose/docker-compose.yml up -d
      - name: Check running containers
        run: docker ps -a
      - name: Show Docker logs
        run: docker compose -f deployment/docker-compose/docker-compose.yml logs --no-color
          
      - name: Smoke health
        run: |
          for i in {1..30}; do
            echo "Checking health attempt $i..."
            if curl -f http://localhost:8000/health; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 5
          done

          echo "Application did not become healthy"
          docker ps -a
          docker compose -f deployment/docker-compose/docker-compose.yml logs --no-color
          exit 1
